name: O1 foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && git diff --exit-code -- packages/management-contracts
      - run: pnpm db:generate
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm test:interop
      - run: go vet ./...
      - name: Linux race regression and named test outcomes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .work/ci-evidence
          printf '%s\n' "$GITHUB_SHA" > .work/ci-evidence/commit.txt
          python3 scripts/verify-sprint2r-evidence.py --fingerprint > .work/ci-evidence/source.txt
          go test -race -count=1 -json ./... | tee .work/go-test.jsonl | jq -c 'select(.Action == "pass" or .Action == "skip" or .Action == "fail")' > .work/ci-evidence/go-results.jsonl
      - name: Retain candidate test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-evidence-${{ github.sha }}
          path: .work/ci-evidence/
          include-hidden-files: true
          retention-days: 14
      - name: PostgreSQL 16 migrations and pooled RLS
        env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: node infrastructure/local-development/tenancy.mjs
